name: Update profile stats

on:
  schedule:
    - cron: "0 1 * * *"      # daily, 01:00 UTC
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/stats_svg.py"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution stats SVG
        env:
          # Optional: add a PAT named PROFILE_TOKEN (scope: read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/stats_svg.py --user vedsom --out assets/contributions.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution stats" && git push)
