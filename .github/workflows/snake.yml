name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=216e39&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39
            dist/github-snake-dark.svg?color_snake=39d353&color_dots=1a1a1a,0e4429,006d32,26a641,39d353

      - uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
