name: Update contributions card

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/contributions.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render assets/contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contributions.py --user "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contributions card" && git push)
