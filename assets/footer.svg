<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="sim to real">
<style>@font-face{font-family:'Anon';font-weight:400;src:url(data:font/woff;base64,) format('woff');}
.m{animation:mv 6s linear infinite}@keyframes mv{from{transform:translateX(-160px)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){.m{animation:none}}</style>
<rect width="1200" height="70" fill="#000000"/>
<rect y="64" width="1200" height="6" fill="#76B900"/>
<rect class="m" x="0" y="60" width="160" height="4" fill="#9BE22A"/>
<text x="600.0" y="34" text-anchor="middle" font-family="'Anon', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="4" fill="#6B6B6B">SIM <tspan fill="#76B900">→</tspan> REAL · BUILT IN BENGALURU</text>
</svg>
